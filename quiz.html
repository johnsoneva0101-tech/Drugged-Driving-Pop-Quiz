<style>
/* 學員端：手機一題一畫面｜教官端（網址加 ?host）：設定精靈、控場看板、題目編輯、設定 */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface2:#F4F6FA; --line:#D2D9E3;
  --ink:#14213A; --muted:#5B6678;
  --navy:#1B365D; --navy-2:#24467A; --gold:#F5B841;
  --accent:#1B4F9C; --accent-soft:#E2EBF8;
  --red:#BF2E20; --red-soft:#FBE8E5;
  --amber:#9A5A00; --amber-soft:#FFF1D8;
  --green:#16704A; --green-soft:#E0F3E9;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.top-in{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.top small{display:block;font-size:11px;color:var(--gold);font-weight:700;letter-spacing:.04em}
.top h1{margin:0;font-size:17px;font-weight:900;line-height:1.25}
.unit-pill{flex:none;background:var(--navy-2);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:800;white-space:nowrap;max-width:45vw;overflow:hidden;text-overflow:ellipsis}
main{max-width:640px;margin:0 auto;padding:16px 16px calc(28px + env(safe-area-inset-bottom,0px))}
.net{display:none;background:var(--red);color:#fff;text-align:center;font-weight:800;font-size:13.5px;padding:6px 10px}
.net.on{display:block}

.card{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:18px 16px}
.center{text-align:center}
.big-ic{font-size:52px;line-height:1.1;margin:4px 0 6px}
.h{margin:0 0 6px;font-size:21px;font-weight:900;line-height:1.35}
.sub{margin:0;color:var(--muted);font-size:15px}
.count{display:inline-block;margin-top:12px;background:var(--accent-soft);color:var(--accent);font-weight:900;border-radius:999px;padding:4px 14px;font-size:15.5px}
.dots::after{content:"…";animation:dots 1.4s steps(4,end) infinite;display:inline-block;width:1.2em;text-align:left;overflow:hidden;vertical-align:bottom}

.lbl{font-weight:900;font-size:17px;margin:0 0 4px}
.hint{margin:0 0 12px;color:var(--muted);font-size:14px}
.units{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ubtn{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 8px;font-weight:800;font-size:16px}
.ubtn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.other{margin-top:10px;display:flex;gap:8px;align-items:center}

.primary{width:100%;margin-top:16px;border:0;border-radius:14px;background:var(--green);color:#fff;font-weight:900;font-size:18px;padding:15px}
.primary:disabled{opacity:.38;cursor:not-allowed}
.note{margin-top:12px;font-size:13px;color:var(--muted);text-align:center}

.qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:900;color:var(--muted);font-size:14.5px}

.abtn span{display:block;font-size:44px;margin-bottom:4px}

.foot{margin-top:18px;text-align:center;font-size:12.5px;color:var(--muted)}

<header class="top"><div class="top-in">
  <div><small>花蓮港務警察總隊｜毒駕查處講習</small><h1 id="ttl">隨堂測驗</h1></div>

<!-- 第一次設定時，教官看板會提供「複製 SQL」按鈕，內容就是這一段 -->
<script type="text/plain" id="sqlText">
-- =====================================================================
-- 毒駕查處隨堂測驗（第 2 版）：Supabase 資料表與函式
-- 用法：Supabase 專案 → 左側「SQL Editor」→ 整段貼上 → 按「Run」
-- 可重複執行（會清除舊資料，重新建立；教官密碼會回到預設 8888）
-- =====================================================================

drop function if exists public.quiz_poll(text);
drop function if exists public.quiz_join(text, text);
drop function if exists public.quiz_answer(text, int, text);
drop function if exists public.quiz_host(text, text, int);
drop function if exists public.quiz_host(text, text, int, jsonb);
drop table if exists public.quiz_answers;
drop table if exists public.quiz_participants;
drop table if exists public.quiz_state;

-- 場次狀態＋題庫設定（只有一列）
create table public.quiz_state (
  id          int primary key default 1 check (id = 1),
  round       int not null default 1,
  status      text not null default 'waiting' check (status in ('waiting','active','revealed','finished')),
  current_q   int not null default 0,
  seconds     int not null default 20,
  started_at  timestamptz,
  deadline_at timestamptz,
  host_hash   text not null,
  config      jsonb not null
);
-- 報到名單（只記單位，不記姓名）
create table public.quiz_participants (
  round int not null, device_id text not null, unit text not null,
  joined_at timestamptz not null default now(),
  primary key (round, device_id)
);
-- 作答紀錄（每支手機每題限一筆）
create table public.quiz_answers (
  round int not null, device_id text not null, q int not null,
  answer text not null check (answer in ('T','F')),
  answered_at timestamptz not null default now(),
  primary key (round, device_id, q)
);

insert into public.quiz_state (id, host_hash, config) values (1,
  encode(sha256(convert_to('8888','UTF8')),'hex'),
  $cfg${
    "units": ["保安隊", "東堤中隊", "和平隊", "刑警隊"],
    "seconds": 20,
    "passRate": 0.6,
    "questions": [
      {"text": "10/31 新制上路後，汽機車毒駕「拒測」首犯罰 27 萬元，且不論車主是誰，車子一律移置保管送監理站沒入。", "answer": true,
       "comment": "正解【⭕ 是】：新制拒測首犯 27 萬，依第 35 條第 9 項不論車主為誰一律扣車送監理站沒入。"},
      {"text": "處理單純交通事故，就可以直接要求快篩並拖吊移置車輛。", "answer": false,
       "comment": "正解【❌ 否】：嚴禁無差別普篩！須具備觀測表【壹】或【貳】客觀異常之一才能啟動唾篩。"},
      {"text": "駕駛人現場「拒絕唾液快篩」且「拒絕自願採尿」，可以直接用「拒測／拒採尿」當理由上銬逮捕。", "answer": false,
       "comment": "正解【❌ 否】：拒測或拒採尿本身不是逮捕理由，須具「不能安全駕駛客觀情狀」始得依刑訴第 88 條逮捕。"},
      {"text": "唾液快篩失敗達 2 次（無 C 線）時，視同拒測，應當場開立 27 萬元拒測紅單並扣車。", "answer": false,
       "comment": "正解【❌ 否】：失敗 2 次不等於拒測，現場暫不開單扣車，應先詢問是否願意配合「自願採尿」。"},
      {"text": "員警攔查車輛時，發現車內有毒品，且駕駛人無行車異常及精神狀況均正常情況下，得直接實施唾液快篩？", "answer": false,
       "comment": "正解【❌ 否】：【壹】與【貳】皆無異常時嚴禁毒駕普篩；毒品另依毒品案偵辦，觀測表仍須照實填寫記錄狀態。"}
    ]
  }$cfg$::jsonb);

-- 權限：資料表一律不開放直接讀寫，只能透過下方函式
alter table public.quiz_state        enable row level security;
alter table public.quiz_participants enable row level security;
alter table public.quiz_answers      enable row level security;
revoke all on public.quiz_state, public.quiz_participants, public.quiz_answers from anon, authenticated;

-- 輪詢（學員只拿得到目前題目的文字，拿不到正解與短評）
create function public.quiz_poll(p_device text)
returns json language plpgsql security definer set search_path = public as $$
declare s quiz_state; r json;
begin
  update quiz_state set status = 'revealed' where id = 1 and status = 'active' and now() > deadline_at;
  select * into s from quiz_state where id = 1;
  select json_build_object(
    'now',      floor(extract(epoch from clock_timestamp()) * 1000),
    'round',    s.round,
    'status',   s.status,
    'q',        s.current_q,
    'nq',       jsonb_array_length(s.config->'questions'),
    'qtext',    case when s.status in ('active','revealed') then s.config->'questions'->(s.current_q - 1)->>'text' end,
    'unitList', s.config->'units',
    'seconds',  s.seconds,
    'deadline', case when s.deadline_at is null then null else floor(extract(epoch from s.deadline_at) * 1000) end,
    'total',    (select count(*) from quiz_participants where round = s.round),
    'units',    coalesce((select json_agg(json_build_object('u', unit, 'n', n) order by n desc, unit)
                            from (select unit, count(*) n from quiz_participants where round = s.round group by unit) x), '[]'::json),
    'me_unit',  (select unit from quiz_participants where round = s.round and device_id = p_device),
    'me_ans',   (select answer from quiz_answers where round = s.round and device_id = p_device and q = s.current_q),
    'answered', (select count(*) from quiz_answers where round = s.round and q = s.current_q),
    'counts',   case when s.status in ('revealed','finished') then
                  (select json_build_object('t', count(*) filter (where answer = 'T'), 'f', count(*) filter (where answer = 'F'))
                     from quiz_answers where round = s.round and q = s.current_q) end,
    'summary',  case when s.status = 'finished' then
                  coalesce((select json_agg(json_build_object('q', q, 't', t, 'f', f) order by q)
                              from (select q, count(*) filter (where answer = 'T') t, count(*) filter (where answer = 'F') f
                                      from quiz_answers where round = s.round group by q) y), '[]'::json) end
  ) into r;
  return r;
end $$;

-- 報到
create function public.quiz_join(p_device text, p_unit text)
returns json language plpgsql security definer set search_path = public as $$
declare rd int; u text := btrim(coalesce(p_unit, ''));
begin
  if length(coalesce(p_device, '')) < 8 or length(p_device) > 64 then return json_build_object('ok', false, 'err', 'bad_device'); end if;
  if length(u) < 1 or length(u) > 20 then return json_build_object('ok', false, 'err', 'bad_unit'); end if;
  select round into rd from quiz_state where id = 1;
  insert into quiz_participants (round, device_id, unit) values (rd, p_device, u)
  on conflict (round, device_id) do update set unit = excluded.unit;
  return json_build_object('ok', true, 'round', rd);
end $$;

-- 作答（目前這一題、時間內、已報到，每題限一次；寬限 1.5 秒網路延遲）
create function public.quiz_answer(p_device text, p_q int, p_ans text)
returns json language plpgsql security definer set search_path = public as $$
declare s quiz_state;
begin
  select * into s from quiz_state where id = 1;
  if s.status not in ('active','revealed') or s.current_q <> p_q or now() > s.deadline_at + interval '1.5 seconds' then
    return json_build_object('ok', false, 'err', 'closed');
  end if;
  if p_ans not in ('T','F') then return json_build_object('ok', false, 'err', 'bad_answer'); end if;
  if not exists (select 1 from quiz_participants where round = s.round and device_id = p_device) then
    return json_build_object('ok', false, 'err', 'not_joined');
  end if;
  insert into quiz_answers (round, device_id, q, answer) values (s.round, p_device, p_q, p_ans) on conflict do nothing;
  return json_build_object('ok', true, 'ans', (select answer from quiz_answers where round = s.round and device_id = p_device and q = p_q));
end $$;

-- 教官控場（需密碼）：check／get_config／save_config／set_pin／start／reveal／finish／reset
create function public.quiz_host(p_pin text, p_action text, p_q int default null, p_data jsonb default null)
returns json language plpgsql security definer set search_path = public as $$
declare s quiz_state; n int; i int; qs jsonb; sec int; newpin text;
begin
  select * into s from quiz_state where id = 1;
  if encode(sha256(convert_to(coalesce(p_pin, ''), 'UTF8')), 'hex') <> s.host_hash then
    perform pg_sleep(1);   -- 密碼錯誤延遲 1 秒，防止被程式猜密碼
    return json_build_object('ok', false, 'err', 'bad_pin');
  end if;
  n := jsonb_array_length(s.config->'questions');

  if p_action = 'check' then
    null;
  elsif p_action = 'get_config' then
    return json_build_object('ok', true, 'config', s.config);
  elsif p_action = 'save_config' then
    if s.status = 'active' then return json_build_object('ok', false, 'err', 'busy'); end if;
    qs := p_data->'questions';
    if jsonb_typeof(qs) <> 'array' or jsonb_array_length(qs) < 1 or jsonb_array_length(qs) > 50 then
      return json_build_object('ok', false, 'err', 'bad_questions');
    end if;
    for i in 0 .. jsonb_array_length(qs) - 1 loop
      if length(btrim(coalesce(qs->i->>'text', ''))) = 0 or jsonb_typeof(qs->i->'answer') <> 'boolean' then
        return json_build_object('ok', false, 'err', 'bad_questions', 'at', i + 1);
      end if;
    end loop;
    if jsonb_typeof(p_data->'units') <> 'array' then return json_build_object('ok', false, 'err', 'bad_units'); end if;
    sec := coalesce((p_data->>'seconds')::int, 20);
    if sec < 5 or sec > 180 then return json_build_object('ok', false, 'err', 'bad_seconds'); end if;
    update quiz_state set config = jsonb_build_object(
        'units', p_data->'units', 'seconds', sec,
        'passRate', coalesce((p_data->>'passRate')::numeric, 0.6), 'questions', qs)
     where id = 1;
  elsif p_action = 'set_pin' then
    newpin := btrim(coalesce(p_data->>'pin', ''));
    if length(newpin) < 4 then return json_build_object('ok', false, 'err', 'short_pin'); end if;
    update quiz_state set host_hash = encode(sha256(convert_to(newpin, 'UTF8')), 'hex') where id = 1;
  elsif p_action = 'start' then
    if p_q is null or p_q < 1 or p_q > n then return json_build_object('ok', false, 'err', 'bad_q'); end if;
    sec := coalesce((s.config->>'seconds')::int, 20);
    update quiz_state set status = 'active', current_q = p_q, seconds = sec,
           started_at = now(), deadline_at = now() + make_interval(secs => sec) where id = 1;
  elsif p_action = 'reveal' then
    update quiz_state set status = 'revealed', deadline_at = least(deadline_at, now()) where id = 1 and status = 'active';
  elsif p_action = 'finish' then
    update quiz_state set status = 'finished' where id = 1;
  elsif p_action = 'reset' then
    update quiz_state set round = round + 1, status = 'waiting', current_q = 0, started_at = null, deadline_at = null where id = 1;
  else
    return json_build_object('ok', false, 'err', 'bad_action');
  end if;
  return json_build_object('ok', true);
end $$;

revoke all on function public.quiz_poll(text)                    from public;
revoke all on function public.quiz_join(text, text)              from public;
revoke all on function public.quiz_answer(text, int, text)       from public;
revoke all on function public.quiz_host(text, text, int, jsonb)  from public;
grant execute on function public.quiz_poll(text)                   to anon, authenticated;
grant execute on function public.quiz_join(text, text)             to anon, authenticated;
grant execute on function public.quiz_answer(text, int, text)      to anon, authenticated;
grant execute on function public.quiz_host(text, text, int, jsonb) to anon, authenticated;
</script>

function normUrl(u){ return String(u || "").trim().replace(/\/+$/,"").replace(/\/rest\/v1$/,"").replace(/\/+$/,""); }
function cfg(){ return { url: normUrl(CONN.url || LS.get("dq_url") || ""), key: (CONN.key || LS.get("dq_key") || "").trim(), embedded: !!(CONN.url && CONN.key) }; }

function hasCfg(){ const c = cfg(); return URL_OK(c.url) && c.key.length > 10; }
let offset = 0, bestRtt = Infinity;
async function rpc(name, args, timeoutMs, override){
  const c = override || cfg();
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), timeoutMs || 6000);
  try {
    const res = await fetch(`${c.url}/rest/v1/rpc/${name}`, {
      method:"POST", signal: ctl.signal, cache:"no-store",
      headers:{ "Content-Type":"application/json", "apikey": c.key, "Authorization": "Bearer " + c.key },
      body: JSON.stringify(args || {})
    });
    if (!res.ok) { const e = new Error("HTTP " + res.status); e.status = res.status; throw e; }
    return await res.json();
  } finally { clearTimeout(tm); }
}
async function poll(device){
  const t0 = Date.now();
  const s = await rpc("quiz_poll", { p_device: device || "" });
  const rtt = Date.now() - t0, est = s.now - (t0 + rtt / 2);
  if (rtt <= bestRtt * 1.5 || Math.abs(est - offset) > 2000) { offset = est; bestRtt = Math.min(bestRtt, rtt); }
  return s;
}
function remain(s){ return s && s.deadline ? Math.max(0, (s.deadline - (Date.now() + offset)) / 1000) : 0; }

        <p class="note">目前全場已進場 ${S.total} 人</p>

      if (other && !val) { const n = document.getElementById("otherIn"); if (n) n.focus(); }
      return;
    }
    const q = S.q, mine = S.me_ans || pending[q] || null;
    const mineTxt = mine === "T" ? "⭕ 是" : mine === "F" ? "❌ 否" : "未作答";
    if (S.status === "waiting") {
      app.innerHTML = `<main><div class="card center"><div class="big-ic">✅</div>
        <p class="h">【${esc(S.me_unit)}】報到成功！</p>
        <p class="sub">等待教官開啟第 1 題<span class="dots"></span></p>

      const over = remain(S) <= 0;

  app.addEventListener("keydown", e => { if (e.target.id === "otherIn" && e.key === "Enter" && canJoin()) doJoin(); });
  const saved = LS.get("dq_unit");
  if (saved) pick = saved;

  async function loop(){
    if (hasCfg()) {
      try {
        const s = await poll(device); setNet(true);

      } catch(e) { setNet(false); }
    }
    render();
    setTimeout(loop, document.hidden ? 4000 : 1500);
  }
  setInterval(tick, 250);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) loop(); });
  render(true); loop();
}

        <p>教官控場：同一個網址後面加上 <b class="k">?host</b>。預設教官密碼 <b class="k">8888</b>，進去後請到「設定」分頁改掉。</p>

  async function wizardTest(){
    const url = normUrl(document.getElementById("wUrl").value), key = document.getElementById("wKey").value.trim();
    const m = document.getElementById("wMsg");
    if (/^sb_secret_/.test(key)) { m.className = "msg err"; m.textContent = "這是秘密金鑰（sb_secret_），不能使用！請改貼 sb_publishable_ 開頭的那一把，並建議到 Supabase 把這把秘密金鑰刪除重發。"; return; }
    if (!URL_OK(url)) { m.className = "msg err"; m.textContent = "網址格式不對，應該像 https://xxxxxxxx.supabase.co"; return; }
    if (key.length < 20) { m.className = "msg err"; m.textContent = "金鑰太短，請確認有完整複製。"; return; }
    m.className = "msg"; m.textContent = "測試中…";
    try {
      const s = await rpc("quiz_poll", { p_device: "" }, 8000, { url, key });
      if (typeof s.nq !== "number") throw Object.assign(new Error("HTTP 404"), { status: 404 });
      LS.set("dq_url", url); LS.set("dq_key", key); wizStep = 4;
      wizardView("✅ 連線成功！題庫已就緒（" + s.nq + " 題）", "ok");
    } catch(e) { m.className = "msg err"; m.textContent = "❌ " + connErr(e); }
  }

  /* ---------- 登入 ---------- */
  function loginView(err){
    document.getElementById("topRight").innerHTML = "";
    app.innerHTML = `<div class="login"><div class="panel">
      <h3>請輸入教官密碼</h3>
      <input type="password" id="pin" autocomplete="off" value="">
      <div class="err" id="perr">${esc(err || "")}</div>
      <button type="button" class="cbtn go" id="pinGo" style="width:100%">進入控場看板</button>
      <p class="empty" style="margin-top:14px">第一次使用預設密碼為 8888。<button type="button" class="mini" id="toWiz" style="margin-left:6px">重新設定連線</button></p></div></div>`;
    const p = document.getElementById("pin"); if (p) p.focus();
  }
  async function tryLogin(){
    const v = document.getElementById("pin").value.trim(), e = document.getElementById("perr");
    e.textContent = "驗證中…";
    try {
      const r = await rpc("quiz_host", { p_pin: v, p_action: "get_config" });
      if (r.ok) { pin = v; SS.set("dq_pin", v); CFG = r.config; tab = "ctrl"; lastKey = ""; app.innerHTML = ""; loop(); }
      else e.textContent = "密碼錯誤";
    } catch(err) { e.textContent = "❌ " + connErr(err); }
  }
  async function hostCall(action, q, data){
    const r = await rpc("quiz_host", { p_pin: pin, p_action: action, p_q: q == null ? null : q, p_data: data == null ? null : data });
    if (!r.ok && r.err === "bad_pin") { pin = ""; SS.del("dq_pin"); loginView("密碼已變更，請重新輸入"); throw new Error("bad_pin"); }
    return r;
  }
  async function loadCfg(){ const r = await hostCall("get_config"); if (r.ok) CFG = r.config; return CFG; }

  /* ---------- 版面：分頁 ---------- */
  function shell(){
    const warn = cfg().embedded ? "" : `<div class="banner"><div>⚠ 這份檔案還沒內建連線資料，學員手機會連不上。請下載設定好的檔案再上傳網站。<button type="button" class="mini" data-a="download">⬇ 下載設定好的 quiz.html</button></div></div>`;
    const t = (id, name) => `<button type="button" class="htab" data-tab="${id}" aria-selected="${tab === id}">${name}</button>`;
    app.innerHTML = `${warn}<nav class="htabs">${t("ctrl","📊 控場看板")}${t("edit","📝 題目編輯")}${t("set","⚙ 設定")}</nav><div id="hBody"></div>`;
  }
  function setTab(t){
    if (tab === "edit" && t !== "edit" && dirty && !confirm("題目有修改尚未儲存，確定要離開嗎？（未儲存的修改會遺失）")) return;
    if (t !== "edit") { dirty = false; draft = null; }
    tab = t; lastKey = ""; shell();
    if (t === "ctrl") render(true);
    else if (t === "edit") { document.getElementById("hBody").innerHTML = `<div class="hwrap one"><div class="panel">讀取題庫中…</div></div>`; loadCfg().then(() => { draft = JSON.parse(JSON.stringify(CFG)); dirty = false; editView(); }).catch(() => {}); }
    else { document.getElementById("hBody").innerHTML = `<div class="hwrap one"><div class="panel">讀取設定中…</div></div>`; loadCfg().then(setView).catch(() => {}); }
    window.scrollTo({ top:0 });
  }

  /* ---------- 控場看板 ---------- */
  function joinUrl(){ return location.origin + location.pathname; }
  function render(force){
    if (!pin) return;
    document.getElementById("topRight").innerHTML = `<span style="font-size:15px;font-weight:800"><span class="dot${ok ? "" : " off"}"></span>${ok ? "連線正常" : "連線中斷"}${S ? `｜第 ${S.round} 梯次` : ""}</span>`;
    if (tab !== "ctrl") return;
    if (!document.getElementById("hBody")) shell();
    if (!S || !CFG) return;
    const key = [S.status, S.q, S.total, S.answered, JSON.stringify(S.units), JSON.stringify(S.counts), JSON.stringify(S.summary), busy, remain(S) > 0].join("~");
    if (!force && key === lastKey) { tick(); return; }
    lastKey = key;
    const Q = CFG.questions || [], NQ = Q.length;
    const unitsHtml = S.units.length ? `<div class="chips">${S.units.map(x => `<span class="chip">${esc(x.u)}<b>${x.n}</b></span>`).join("")}</div>` : `<p class="empty">尚無人報到</p>`;
    const side = `<div class="panel"><h3>進場報到監控</h3><div class="total">${S.total}<small>人已進場</small></div>${unitsHtml}</div>`;
    const stName = { waiting:"報到待機中", active:`第 ${S.q} 題作答中`, revealed:`第 ${S.q} 題已揭曉`, finished:"測驗結束" }[S.status];
    const item = Q[S.q - 1] || { text: S.qtext || "", answer:true, comment:"" };
    let stage = `<div class="hq-meta"><span class="status ${S.status}">${stName}</span>${S.status === "active" || S.status === "revealed" ? `<span class="hq-n">第 ${S.q} 題／共 ${NQ} 題</span>` : `<span class="hq-n">題庫共 ${NQ} 題・每題 ${CFG.seconds || 20} 秒</span>`}</div>`;
    if (S.status === "waiting") {
      const link = joinUrl(), web = /^https?:/.test(link);
      stage += `<div class="panel"><div class="qrbox">${web ? `<img alt="報到 QR Code" src="https://api.qrserver.com/v1/create-qr-code/?size=360x360&margin=0&data=${encodeURIComponent(link)}" onerror="this.remove()">` : ""}
        <div style="flex:1;min-width:240px"><p class="big">請掃描 QR Code<br>選擇單位後報到進場</p>
        <p class="url">${web ? esc(link) : "（目前以本機檔案開啟；上傳網站後這裡會顯示學員報到網址與 QR Code）"}</p></div></div></div>
        <p class="empty" style="font-size:17px">確認各單位都已進場後，按下方「▶ 開始第 1 題」。</p>`;
    } else if (S.status === "active") {
      stage += `<p class="hq-text">${esc(item.text)}</p><div class="htimer" id="htm">--</div><div class="hbar" id="hb"><i id="hbi" style="width:100%"></i></div>
        <div class="answered">已作答 <b>${S.answered}</b> ／ 已進場 ${S.total} 人</div>`;
    } else if (S.status === "revealed") {
      stage += `<p class="hq-text">${esc(item.text)}</p>` + barsHTML(item);
    } else {
      stage += `<p class="done-h">✅ 隨堂測驗結束，正式課程開始！</p>` + summaryHTML(Q);
    }
    const d = busy ? "disabled" : "";
    let main = "";
    if (S.status === "waiting") main = `<button type="button" class="cbtn go" data-a="start" data-q="1" ${d || (NQ ? "" : "disabled")}>▶ 開始第 1 題</button>`;
    else if (S.status === "active") main = `<button type="button" class="cbtn stop" data-a="reveal" ${d}>⏹ 立即截止本題</button>`;
    else if (S.status === "revealed") main = S.q < NQ ? `<button type="button" class="cbtn" data-a="start" data-q="${S.q + 1}" ${d}>⏭ 下一題（第 ${S.q + 1} 題）</button>` : `<button type="button" class="cbtn go" data-a="finish" ${d}>🏁 結束測驗</button>`;
    document.getElementById("hBody").innerHTML = `<div class="hwrap">${side}<div class="stage">${stage}</div></div>
      <div class="ctrl">${main}<span class="sp"></span>
      <button type="button" class="cbtn ghost" data-a="reset" ${d}>🔄 重置整場（開新梯次）</button>
      <button type="button" class="cbtn ghost" data-a="logout">登出</button></div>`;
    tick();
  }
  function barsHTML(item){
    const c = S.counts || { t:0, f:0 }, total = Math.max(S.total, c.t + c.f), none = Math.max(0, total - c.t - c.f);
    const pct = n => total ? Math.round(n / total * 100) : 0, pr = CFG.passRate == null ? 0.6 : CFG.passRate;
    const right = item.answer ? c.t : c.f, rate = total ? right / total : 0, bad = rate < pr;
    const row = (cls, label, n, isRight) => `<div class="brow ${cls}${isRight ? " right" : ""}"><span class="bl">${label}</span><span class="bt"><i style="width:${pct(n)}%"></i></span><span class="bv">${n} 人｜${pct(n)}%</span></div>`;
    return `<div class="bars">${row("t","⭕ 選是",c.t,item.answer)}${row("f","❌ 選否",c.f,!item.answer)}${row("x","⏰ 逾時未答",none,false)}</div>
      <div class="acc${bad ? " bad" : ""}">答對率 ${Math.round(rate * 100)}%（答對 ${right} 人／已進場 ${total} 人）${bad ? "　⚠ 低於 " + Math.round(pr * 100) + "%，觀念需加強" : ""}</div>
      ${item.comment ? `<div class="comment">${esc(item.comment)}</div>` : ""}`;
  }
  function summaryHTML(Q){
    const pr = CFG.passRate == null ? 0.6 : CFG.passRate;
    const rows = Q.map((it, i) => {
      const r = (S.summary || []).find(x => x.q === i + 1) || { t:0, f:0 };
      const total = Math.max(S.total, r.t + r.f), right = it.answer ? r.t : r.f, rate = total ? right / total : 0;
      return `<tr><td>第 ${i + 1} 題</td><td>${esc(it.text)}</td><td class="r">${it.answer ? "⭕ 是" : "❌ 否"}</td><td class="r${rate < pr ? " bad" : ""}">${Math.round(rate * 100)}%</td></tr>`;
    }).join("");
    return `<div class="panel"><table class="sum"><thead><tr><th style="width:5.5em">題號</th><th>題目</th><th style="width:5em">正解</th><th style="width:5em">答對率</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  function tick(){
    if (tab !== "ctrl" || !S || S.status !== "active") return;
    const r = remain(S), tm = document.getElementById("htm"), bi = document.getElementById("hbi"), hb = document.getElementById("hb");
    if (tm) { tm.textContent = Math.ceil(r); tm.classList.toggle("low", r <= 5); }
    if (bi) bi.style.width = (r / (S.seconds || 20) * 100) + "%";
    if (hb) hb.classList.toggle("low", r <= 5);
    if (r <= 0 && !busy && !tick.sent) { tick.sent = true; act("reveal").then(() => { tick.sent = false; }); }
  }
  async function act(action, q){
    if (busy) return; busy = true; render(true);
    try { await hostCall(action, q); S = await poll(""); ok = true; }
    catch(e) { if (e.message === "bad_pin") { busy = false; return; } ok = false; }
    busy = false; lastKey = ""; render(true);
  }

  /* ---------- 題目編輯 ---------- */

    const locked = S && S.status === "active";
    const Q = draft.questions;
    document.getElementById("hBody").innerHTML = `<div class="hwrap one"><div class="stage">
      <div class="panel"><h3>題目編輯</h3><p>可直接修改題目、正解與教官短評，用「↑」「↓」調整順序。改完記得按下方「💾 儲存題庫」。</p>
        <p class="empty">短評只會在大螢幕揭曉時顯示，學員手機看不到；學員也拿不到正解。</p>
        ${locked ? `<div class="warnbox">目前正在作答中，請等本題截止後再儲存。</div>` : ""}</div>
      ${Q.map((it, i) => `<div class="qcard"><div class="qh"><b>第 ${i + 1} 題</b><span class="row" style="margin:0">

        <span class="lab">教官一句話短評（揭曉時顯示在大螢幕，可留空）</span><textarea rows="2" data-f="comment" data-i="${i}">${esc(it.comment || "")}</textarea>

      <button type="button" class="cbtn" id="qAdd" style="align-self:flex-start">＋ 新增題目</button>
    </div></div>
    <div class="edbar"><button type="button" class="cbtn go" id="qSave" ${locked ? "disabled" : ""}>💾 儲存題庫（${Q.length} 題）</button>
      <button type="button" class="cbtn ghost" id="qUndo">放棄修改</button><span class="msg" id="qMsg">${dirty ? "● 有修改尚未儲存" : ""}</span></div>`;
  }
  function markDirty(){ dirty = true; const m = document.getElementById("qMsg"); if (m) { m.className = "msg"; m.textContent = "● 有修改尚未儲存"; } }
  async function saveAll(newCfg, msgEl){
    const m = document.getElementById(msgEl);
    try {
      const r = await hostCall("save_config", null, newCfg);
      if (r.ok) { CFG = JSON.parse(JSON.stringify(newCfg)); lastKey = ""; if (m) { m.className = "msg ok"; m.textContent = "✅ 已儲存"; } toast("已儲存"); return true; }
      const why = { busy:"作答中不能儲存，請等本題截止後再試。", bad_questions: r.at ? `第 ${r.at} 題的題目是空白的，請補上或刪除。` : "至少要有 1 題。", bad_seconds:"作答秒數請在 5～180 之間。", bad_units:"單位清單格式錯誤。" }[r.err] || r.err;
      if (m) { m.className = "msg err"; m.textContent = "❌ " + why; }
    } catch(e) { if (m && e.message !== "bad_pin") { m.className = "msg err"; m.textContent = "❌ " + connErr(e); } }

  }

  /* ---------- 設定 ---------- */

  /* ---------- 事件 ---------- */
  app.addEventListener("click", async e => {
    const b = e.target.closest("button"); if (!b) return;
    // 精靈
    if (b.id === "wCopy") { copyText(sqlText(), "已複製 SQL，請到 Supabase 的 SQL Editor 貼上執行"); if (wizStep < 3) { wizStep = 3; } return; }
    if (b.id === "wTest") { wizardTest(); return; }
    if (b.id === "wDown") { downloadConfigured(); return; }
    if (b.id === "wLogin") { loginView(); return; }
    if (b.id === "toWiz") { wizStep = 1; wizardView(); return; }
    if (b.id === "pinGo") { tryLogin(); return; }
    if (b.dataset.tab) { setTab(b.dataset.tab); return; }
    const a = b.dataset.a;
    if (a === "download") { downloadConfigured(); return; }
    if (a === "logout") { pin = ""; SS.del("dq_pin"); loginView(); return; }
    if (a === "reset" && !b.classList.contains("armed")) {
      b.classList.add("armed"); b.textContent = "再按一次確認重置（目前梯次結束，開新梯次）";
      setTimeout(() => { if (b.isConnected) { b.classList.remove("armed"); b.textContent = "🔄 重置整場（開新梯次）"; } }, 4000);
      return;
    }
    if (a) { act(a, b.dataset.q ? Number(b.dataset.q) : null); return; }
    // 題目編輯
    if (b.dataset.mv !== undefined) { const i = +b.dataset.mv, j = i + +b.dataset.dir, Q = draft.questions; [Q[i], Q[j]] = [Q[j], Q[i]]; markDirty(); editView(); return; }
    if (b.dataset.del !== undefined) {
      if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "再按一次確認刪除"; setTimeout(() => { if (b.isConnected) { b.classList.remove("armed"); b.textContent = "🗑 刪除"; } }, 3000); return; }
      draft.questions.splice(+b.dataset.del, 1); markDirty(); editView(); return;
    }
    if (b.dataset.ansset !== undefined) { draft.questions[+b.dataset.ansset].answer = b.dataset.v === "1"; markDirty(); editView(); return; }
    if (b.id === "qAdd") {
      draft.questions.push({ text:"", answer:true, comment:"" }); markDirty(); editView();
      const t = document.querySelectorAll('textarea[data-f="text"]'); const last = t[t.length - 1]; if (last) { last.focus(); last.scrollIntoView({ block:"center" }); }
      return;
    }
    if (b.id === "qUndo") { draft = JSON.parse(JSON.stringify(CFG)); dirty = false; editView(); return; }
    if (b.id === "qSave") {
      const out = JSON.parse(JSON.stringify(draft));
      out.questions = out.questions.map(q => ({ text: q.text.trim(), answer: !!q.answer, comment: (q.comment || "").trim() }));
      if (await saveAll(out, "qMsg")) { draft = JSON.parse(JSON.stringify(CFG)); dirty = false; editView(); const m = document.getElementById("qMsg"); m.className = "msg ok"; m.textContent = "✅ 已儲存，學員端立即生效"; }
      return;
    }
    // 設定
    if (b.id === "sSave") {
      const units = document.getElementById("sUnits").value.split("\n").map(x => x.trim()).filter(Boolean).slice(0, 30);
      const sec = Number(document.getElementById("sSec").value), pass = Number(document.getElementById("sPass").value);
      const m = document.getElementById("sMsg");
      if (!(sec >= 5 && sec <= 180)) { m.className = "msg err"; m.textContent = "❌ 作答秒數請在 5～180 之間"; return; }
      if (!(pass >= 0 && pass <= 100)) { m.className = "msg err"; m.textContent = "❌ 門檻請在 0～100 之間"; return; }
      await loadCfg().catch(() => {});
      saveAll(Object.assign({}, CFG, { units, seconds: sec, passRate: pass / 100 }), "sMsg");
      return;
    }
    if (b.id === "pSave") {
      const p1 = document.getElementById("pNew").value.trim(), p2 = document.getElementById("pNew2").value.trim(), m = document.getElementById("pMsg");
      if (p1.length < 4) { m.className = "msg err"; m.textContent = "❌ 密碼至少 4 碼（建議 6 碼以上）"; return; }
      if (p1 !== p2) { m.className = "msg err"; m.textContent = "❌ 兩次輸入不一樣"; return; }
      try { const r = await hostCall("set_pin", null, { pin: p1 }); if (r.ok) { pin = p1; SS.set("dq_pin", p1); m.className = "msg ok"; m.textContent = "✅ 密碼已更改，下次登入請用新密碼"; document.getElementById("pNew").value = document.getElementById("pNew2").value = ""; } }
      catch(err) { if (err.message !== "bad_pin") { m.className = "msg err"; m.textContent = "❌ " + connErr(err); } }
      return;
    }
    if (b.id === "sCopySql") { copyText(sqlText(), "已複製 SQL"); return; }
    if (b.id === "sForget") { LS.del("dq_url"); LS.del("dq_key"); pin = ""; SS.del("dq_pin"); wizStep = 1; wizardView(); return; }
  });
  app.addEventListener("input", e => {
    const t = e.target;
    if (t.dataset && t.dataset.f && draft) { draft.questions[+t.dataset.i][t.dataset.f] = t.value; markDirty(); }
  });
  app.addEventListener("keydown", e => { if (e.target.id === "pin" && e.key === "Enter") tryLogin(); });
  window.addEventListener("beforeunload", e => { if (tab === "edit" && dirty) { e.preventDefault(); e.returnValue = ""; } });

  let running = false;
  async function loop(){
    if (running) return; running = true;
    while (pin) {
      if (!busy) {
        try { S = await poll(""); ok = true; if (!CFG) await loadCfg(); } catch(e) { ok = false; }
        render();
      }
      await new Promise(z => setTimeout(z, 1000));
    }
    running = false;
  }
  setInterval(tick, 200);
  if (!hasCfg()) wizardView();
  else if (pin) { shell(); loop(); }
  else loginView();
}

if (IS_HOST) hostInit(); else studentInit();
</script></body></html>
