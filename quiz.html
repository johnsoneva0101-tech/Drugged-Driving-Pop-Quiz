<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B365D">
<title>毒駕查處隨堂測驗</title>
<style>
/* 學員端：手機一題一畫面｜教官端（網址加 ?host）：設定精靈、控場看板、題目編輯、設定 */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface2:#F4F6FA; --line:#D2D9E3;
  --ink:#14213A; --muted:#5B6678;
  --navy:#1B365D; --navy-2:#24467A; --gold:#F5B841;
  --accent:#1B4F9C; --accent-soft:#E2EBF8;
  --red:#BF2E20; --red-soft:#FBE8E5;
  --amber:#9A5A00; --amber-soft:#FFF1D8;
  --green:#16704A; --green-soft:#E0F3E9;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.top-in{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.top small{display:block;font-size:11px;color:var(--gold);font-weight:700;letter-spacing:.04em}
.top h1{margin:0;font-size:17px;font-weight:900;line-height:1.25}
.unit-pill{flex:none;background:var(--navy-2);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:800;white-space:nowrap;max-width:45vw;overflow:hidden;text-overflow:ellipsis}
main{max-width:640px;margin:0 auto;padding:16px 16px calc(28px + env(safe-area-inset-bottom,0px))}
.net{display:none;background:var(--red);color:#fff;text-align:center;font-weight:800;font-size:13.5px;padding:6px 10px}
.net.on{display:block}

.card{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:18px 16px}
.center{text-align:center}
.big-ic{font-size:52px;line-height:1.1;margin:4px 0 6px}
.h{margin:0 0 6px;font-size:21px;font-weight:900;line-height:1.35}
.sub{margin:0;color:var(--muted);font-size:15px}
.count{display:inline-block;margin-top:12px;background:var(--accent-soft);color:var(--accent);font-weight:900;border-radius:999px;padding:4px 14px;font-size:15.5px}
.dots::after{content:"…";animation:dots 1.4s steps(4,end) infinite;display:inline-block;width:1.2em;text-align:left;overflow:hidden;vertical-align:bottom}
@keyframes dots{0%{width:0}100%{width:1.2em}}

.lbl{font-weight:900;font-size:17px;margin:0 0 4px}
.hint{margin:0 0 12px;color:var(--muted);font-size:14px}
.units{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ubtn{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 8px;font-weight:800;font-size:16px}
.ubtn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.other{margin-top:10px;display:flex;gap:8px;align-items:center}
.other input{flex:1;min-width:0;border:2px solid var(--accent);border-radius:12px;padding:11px 12px;font-size:16px;background:var(--surface);color:var(--ink)}
.primary{width:100%;margin-top:16px;border:0;border-radius:14px;background:var(--green);color:#fff;font-weight:900;font-size:18px;padding:15px}
.primary:disabled{opacity:.38;cursor:not-allowed}
.note{margin-top:12px;font-size:13px;color:var(--muted);text-align:center}

.qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:900;color:var(--muted);font-size:14.5px}
.timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:30px;color:var(--accent);line-height:1}
.timer.low{color:var(--red)}
.tbar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:14px}
.tbar i{display:block;height:100%;background:var(--accent);transition:width .2s linear}
.tbar.low i{background:var(--red)}
.qtext{font-size:19px;font-weight:800;line-height:1.55;margin:0 0 18px;white-space:pre-wrap}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.abtn{border:3px solid var(--line);background:var(--surface);border-radius:18px;padding:22px 6px;font-size:26px;font-weight:900;line-height:1.2}
.abtn span{display:block;font-size:44px;margin-bottom:4px}
.abtn.t{border-color:#2E7D5B;color:var(--green)}
.abtn.f{border-color:#C0392B;color:var(--red)}
.abtn:disabled{opacity:.35;cursor:default}
.abtn.pick{opacity:1;color:#fff}
.abtn.t.pick{background:var(--green);border-color:var(--green)}
.abtn.f.pick{background:var(--red);border-color:var(--red)}
.locked{margin-top:14px;text-align:center;font-weight:800;font-size:15.5px;border-radius:12px;padding:10px;background:var(--surface2);border:1.5px solid var(--line)}
.locked.warn{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.mine{display:inline-block;margin-top:12px;font-weight:900;font-size:18px;border-radius:12px;padding:8px 16px;background:var(--surface2);border:1.5px solid var(--line)}
.foot{margin-top:18px;text-align:center;font-size:12.5px;color:var(--muted)}
.foot button{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:12.5px;padding:4px 6px}

/* ================= 教官端 ================= */
body.host{background:#0D1626;color:#E6EBF3;font-size:17px}
body.host .top{padding:10px 24px}
body.host .top-in{max-width:none}
body.host .top h1{font-size:21px}
.htabs{display:flex;gap:6px;padding:10px 24px 0;max-width:1500px;margin:0 auto;flex-wrap:wrap}
.htab{border:1.5px solid #2A3A57;background:#162238;color:#9FB3D6;border-radius:12px;padding:9px 18px;font-weight:900;font-size:16px}
.htab[aria-selected="true"]{background:var(--gold);border-color:var(--gold);color:#1A1306}
.banner{max-width:1500px;margin:10px auto 0;padding:0 24px}
.banner div{background:#3B2A08;border:2px solid var(--gold);color:#FFE3A6;border-radius:12px;padding:10px 14px;font-weight:800;font-size:15.5px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hwrap{padding:16px 24px 120px;max-width:1500px;margin:0 auto;display:grid;grid-template-columns:minmax(260px,1fr) 3fr;gap:18px}
.hwrap.one{grid-template-columns:1fr;max-width:1000px}
@media (max-width:900px){.hwrap{grid-template-columns:1fr;padding:14px 14px 140px}.htabs,.banner{padding-left:14px;padding-right:14px}}
.panel{background:#162238;border:1.5px solid #2A3A57;border-radius:18px;padding:18px}
.panel h3{margin:0 0 10px;font-size:17px;color:#9FB3D6;font-weight:900;letter-spacing:.03em}
.panel p{margin:6px 0}
.total{font-size:clamp(48px,6vw,84px);font-weight:900;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.total small{font-size:.32em;color:#9FB3D6;font-weight:800;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:#20314F;border:1px solid #34507E;border-radius:10px;padding:6px 12px;font-weight:800;font-size:17px}
.chip b{color:var(--gold);margin-left:6px;font-size:19px}
.empty{color:#7F90AD;font-size:15px}
.stage{display:flex;flex-direction:column;gap:16px}
.status{display:inline-block;border-radius:999px;padding:4px 14px;font-weight:900;font-size:15px;background:#2A3A57;color:#fff}
.status.active{background:var(--accent)} .status.revealed{background:#B26A00} .status.finished{background:var(--green)}
.hq-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hq-n{font-size:22px;font-weight:900;color:var(--gold)}
.hq-text{font-size:clamp(26px,2.6vw,40px);font-weight:900;line-height:1.5;color:#fff;margin:0;white-space:pre-wrap}
.htimer{font-size:clamp(70px,9vw,140px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:#86ADF0;text-align:center}
.htimer.low{color:#FF7D6E}
.hbar{height:16px;background:#2A3A57;border-radius:10px;overflow:hidden}
.hbar i{display:block;height:100%;background:#86ADF0;transition:width .2s linear}
.hbar.low i{background:#FF7D6E}
.answered{font-size:24px;font-weight:900;text-align:center;color:#C9D6EE}
.answered b{color:#fff;font-size:34px}
.bars{display:flex;flex-direction:column;gap:14px}
.brow{display:grid;grid-template-columns:9.6em 1fr 6.6em;gap:.6em;align-items:center;font-size:clamp(19px,1.9vw,28px)}
.brow .bl{font-weight:900;white-space:nowrap}
.brow .bt{height:clamp(38px,4.2vw,58px);background:#20314F;border-radius:12px;overflow:hidden}
.brow .bt i{display:block;height:100%;border-radius:12px;transition:width .5s ease}
.brow .bv{font-weight:900;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.brow.t i{background:#2FA36B} .brow.f i{background:#D9473A} .brow.x i{background:#6B7A94}
.brow.right .bl::after{content:"✔正解";font-size:.62em;background:var(--gold);color:#1A1306;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:4px}
.acc{border-radius:14px;padding:14px 18px;font-size:22px;font-weight:900;border:3px solid #2FA36B;background:rgba(47,163,107,.12)}
.acc.bad{border-color:#FF5A4A;background:rgba(255,90,74,.14);color:#FFB3AA}
.comment{border-radius:14px;padding:16px 20px;background:#FFF1D8;color:#3B2600;font-size:clamp(22px,2.2vw,32px);font-weight:900;line-height:1.5;white-space:pre-wrap}
.qrbox{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.qrbox img{width:clamp(180px,20vw,280px);height:auto;background:#fff;border-radius:14px;padding:10px}
.qrbox .url{font-size:18px;word-break:break-all;color:#C9D6EE}
.qrbox .big{font-size:clamp(28px,3vw,44px);font-weight:900;color:#fff;line-height:1.3;margin:0 0 8px}
.done-h{font-size:clamp(34px,4vw,56px);font-weight:900;color:#62D39C;text-align:center;margin:10px 0}
table.sum{width:100%;border-collapse:collapse;font-size:19px}
table.sum th{color:#9FB3D6;text-align:left;font-weight:800;padding:8px;border-bottom:2px solid #2A3A57}
table.sum td{padding:10px 8px;border-top:1px solid #2A3A57;vertical-align:top}
table.sum td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:800}
table.sum td.bad{color:#FF7D6E}
.ctrl{position:fixed;left:0;right:0;bottom:0;background:#0A101A;border-top:1px solid #2A3A57;padding:12px 24px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:6}
.cbtn{border:0;border-radius:14px;padding:13px 24px;font-weight:900;font-size:19px;color:#fff;background:var(--accent)}
.cbtn.go{background:#1E8A57} .cbtn.stop{background:#C0392B}
.cbtn:disabled{opacity:.4;cursor:not-allowed}
.cbtn.ghost{background:transparent;border:1.5px solid #3D4F70;color:#C9D6EE;font-size:15px;padding:10px 14px}
.cbtn.ghost.armed,.mini.armed{background:#C0392B!important;border-color:#C0392B!important;color:#fff!important}
.cbtn.small{font-size:16px;padding:10px 16px}
.ctrl .sp{flex:1}
.msg{font-size:15px;color:var(--gold);font-weight:800}
.msg.ok{color:#62D39C} .msg.err{color:#FF7D6E}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#62D39C;margin-right:6px;vertical-align:1px}
.dot.off{background:#FF5A4A}

/* 表單（教官端） */
.fld{display:block;margin:14px 0 0}
.fld>span{display:block;color:#9FB3D6;font-weight:800;font-size:15px;margin-bottom:5px}
.fld input,.fld textarea,.qcard textarea{width:100%;border:1.5px solid #34507E;background:#0D1626;color:#fff;border-radius:10px;padding:10px 12px;font-size:16px;line-height:1.55}
.fld textarea,.qcard textarea{resize:vertical}
.fld small{display:block;color:#7F90AD;font-size:13.5px;margin-top:4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.mini{border:1.5px solid #34507E;background:#20314F;color:#fff;border-radius:10px;padding:7px 12px;font-weight:800;font-size:14.5px}
.mini.del{border-color:#7A2C25;color:#FFB3AA;background:#2B1716}
.mini:disabled{opacity:.35;cursor:not-allowed}

/* 設定精靈 */
.wiz{max-width:860px;margin:18px auto 60px;padding:0 16px;display:flex;flex-direction:column;gap:14px}
.wiz h2{margin:0;font-size:26px;font-weight:900;color:#fff}
.step{display:grid;grid-template-columns:46px 1fr;gap:14px}
.step .n{width:46px;height:46px;border-radius:50%;background:#20314F;border:2px solid #34507E;display:grid;place-items:center;font-weight:900;font-size:20px;color:var(--gold)}
.step.done .n{background:#1E8A57;border-color:#1E8A57;color:#fff}
.step h3{margin:6px 0 6px;font-size:19px;color:#fff;font-weight:900}
.step ol{margin:4px 0;padding-left:22px}
.step li{margin:4px 0}
.step b.k{color:var(--gold)}
.warnbox{margin-top:10px;background:#2B1716;border:2px solid #FF5A4A;color:#FFC9C2;border-radius:12px;padding:10px 14px;font-weight:800}

/* 題目編輯 */
.qcard{background:#162238;border:1.5px solid #2A3A57;border-radius:16px;padding:14px 16px}
.qcard .qh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.qcard .qh b{font-size:18px;color:var(--gold)}
.qcard .lab{display:block;color:#9FB3D6;font-weight:800;font-size:14.5px;margin:10px 0 5px}
.tf{display:inline-flex;gap:6px}
.tf button{border:2px solid #34507E;background:#0D1626;color:#C9D6EE;border-radius:10px;padding:7px 16px;font-weight:900;font-size:16px}
.tf button.on.t{background:#1E8A57;border-color:#1E8A57;color:#fff}
.tf button.on.f{background:#C0392B;border-color:#C0392B;color:#fff}
.edbar{position:fixed;left:0;right:0;bottom:0;background:#0A101A;border-top:1px solid #2A3A57;padding:12px 24px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:6}
.login{max-width:440px;margin:40px auto;padding:0 16px}
.login .panel input{width:100%;border:2px solid #34507E;background:#0D1626;color:#fff;border-radius:12px;padding:12px;font-size:20px;letter-spacing:.2em;text-align:center;margin:8px 0 12px}
.login .err{color:#FF7D6E;font-weight:800;min-height:1.5em;font-size:15px}
.acc.overall{text-align:center;font-size:clamp(22px,2.3vw,30px)}
.qrbox .qrsvg{width:clamp(200px,22vw,300px);flex:none;background:#fff;border-radius:14px;padding:8px;line-height:0}
.qrbox .qrsvg svg{width:100%;height:auto;display:block}
.htab.fs{margin-left:auto}
.keys{color:#7F90AD;font-size:14.5px;margin:0}
.keys kbd{display:inline-block;border:1px solid #3D4F70;border-bottom-width:3px;border-radius:6px;padding:0 7px;margin:0 2px;font:inherit;font-weight:900;color:#C9D6EE;background:#162238}
.cbtn.ghost.sm{font-size:14px;padding:9px 11px}
.upd{max-width:1500px;margin:10px auto 0;padding:0 24px}
.upd div{background:#2B1716;border:2px solid #FF5A4A;color:#FFC9C2;border-radius:12px;padding:10px 14px;font-weight:800;font-size:15.5px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.qsec{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qsec input{width:110px;border:1.5px solid #34507E;background:#0D1626;color:#fff;border-radius:10px;padding:7px 10px;font-size:16px}
.qsec small{color:#7F90AD;font-size:13.5px}
.hist select{border:1.5px solid #34507E;background:#0D1626;color:#fff;border-radius:10px;padding:8px 10px;font-size:16px;max-width:100%}
table.sum td.c{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#F5B841;color:#1A1306;padding:9px 18px;border-radius:999px;font-weight:900;z-index:20;font-size:16px}
</style>
</head>
<body>
<div class="net" id="net">連線中斷，重新連線中…（請確認網路）</div>
<header class="top"><div class="top-in">
  <div><small>花蓮港務警察總隊｜毒駕查處講習</small><h1 id="ttl">隨堂測驗</h1></div>
  <div id="topRight"></div>
</div></header>
<div id="app"></div>

<!-- 第一次設定時，教官看板會提供「複製 SQL」按鈕，內容就是這一段 -->
<script type="text/plain" id="sqlText">
-- =====================================================================
-- 毒駕查處隨堂測驗（第 3 版）：完整安裝 SQL（第一次使用）
-- 用法：Supabase 專案 → 左側「SQL Editor」→ 整段貼上 → 按「Run」
-- ⚠ 會清除所有題目、報到與作答紀錄，教官密碼回到預設 8888。已在使用中請改用「更新用 SQL」
-- =====================================================================

drop function if exists public.quiz_poll(text);
drop function if exists public.quiz_join(text, text);
drop function if exists public.quiz_answer(text, int, text);
drop function if exists public.quiz_host(text, text, int);
drop function if exists public.quiz_host(text, text, int, jsonb);
drop table if exists public.quiz_qlog;
drop table if exists public.quiz_answers;
drop table if exists public.quiz_participants;
drop table if exists public.quiz_state;

-- 場次狀態＋題庫設定（只有一列）
create table public.quiz_state (
  id          int primary key default 1 check (id = 1),
  round       int not null default 1,
  status      text not null default 'waiting' check (status in ('waiting','active','revealed','finished')),
  current_q   int not null default 0,
  seconds     int not null default 20,
  started_at  timestamptz,
  deadline_at timestamptz,
  host_hash   text not null,
  config      jsonb not null
);
-- 報到名單（只記單位，不記姓名）
create table public.quiz_participants (
  round int not null, device_id text not null, unit text not null,
  joined_at timestamptz not null default now(),
  primary key (round, device_id)
);
-- 作答紀錄（每支手機每題限一筆）
create table public.quiz_answers (
  round int not null, device_id text not null, q int not null,
  answer text not null check (answer in ('T','F')),
  answered_at timestamptz not null default now(),
  primary key (round, device_id, q)
);

insert into public.quiz_state (id, host_hash, config) values (1,
  encode(sha256(convert_to('8888','UTF8')),'hex'),
  $cfg${
    "units": ["保安隊", "東堤中隊", "和平隊", "刑警隊"],
    "seconds": 20,
    "passRate": 0.6,
    "questions": [
      {"text": "10/31 新制上路後，汽機車毒駕「拒測」首犯罰 27 萬元，且不論車主是誰，車子一律移置保管送監理站沒入。", "answer": true,
       "comment": "正解【⭕ 是】：新制拒測首犯 27 萬，依第 35 條第 9 項不論車主為誰一律扣車送監理站沒入。"},
      {"text": "處理單純交通事故，就可以直接要求快篩並拖吊移置車輛。", "answer": false,
       "comment": "正解【❌ 否】：嚴禁無差別普篩！須具備觀測表【壹】或【貳】客觀異常之一才能啟動唾篩。"},
      {"text": "駕駛人現場「拒絕唾液快篩」且「拒絕自願採尿」，可以直接用「拒測／拒採尿」當理由上銬逮捕。", "answer": false,

-- 輪詢（學員只拿得到目前題目的文字，拿不到正解與短評）
create or replace function public.quiz_poll(p_device text)
returns json language plpgsql security definer set search_path = public as $$
declare s quiz_state; r json;
begin
  update quiz_state set status = 'revealed' where id = 1 and status = 'active' and now() > deadline_at;
  select * into s from quiz_state where id = 1;
  select json_build_object(
    'v',        3,
    'now',      floor(extract(epoch from clock_timestamp()) * 1000),
    'round',    s.round,
    'status',   s.status,
    'q',        s.current_q,
    'nq',       jsonb_array_length(s.config->'questions'),
    'qtext',    case when s.status in ('active','revealed') then s.config->'questions'->(s.current_q - 1)->>'text' end,
    'unitList', s.config->'units',
    'seconds',  s.seconds,
    'deadline', case when s.deadline_at is null then null else floor(extract(epoch from s.deadline_at) * 1000) end,
    'total',    (select count(*) from quiz_participants where round = s.round),
    'units',    coalesce((select json_agg(json_build_object('u', unit, 'n', n) order by n desc, unit)
                            from (select unit, count(*) n from quiz_participants where round = s.round group by unit) x), '[]'::json),
    'me_unit',  (select unit from quiz_participants where round = s.round and device_id = p_device),
    'me_ans',   (select answer from quiz_answers where round = s.round and device_id = p_device and q = s.current_q),
    'answered', (select count(*) from quiz_answers where round = s.round and q = s.current_q),
    'eligible', (select eligible from quiz_qlog where round = s.round and q = s.current_q),
    'counts',   case when s.status in ('revealed','finished') then
                  (select json_build_object('t', count(*) filter (where answer = 'T'), 'f', count(*) filter (where answer = 'F'))
                     from quiz_answers where round = s.round and q = s.current_q) end,
    'summary',  case when s.status = 'finished' then
                  coalesce((select json_agg(json_build_object('q', q, 't', t, 'f', f) order by q)
                              from (select q, count(*) filter (where answer = 'T') t, count(*) filter (where answer = 'F') f
                                      from quiz_answers where round = s.round group by q) y), '[]'::json) end
  ) into r;
  return r;
end $$;

-- 報到
create or replace function public.quiz_join(p_device text, p_unit text)
returns json language plpgsql security definer set search_path = public as $$
declare rd int; u text := btrim(coalesce(p_unit, ''));
begin
  if length(coalesce(p_device, '')) < 8 or length(p_device) > 64 then return json_build_object('ok', false, 'err', 'bad_device'); end if;
  if length(u) < 1 or length(u) > 20 then return json_build_object('ok', false, 'err', 'bad_unit'); end if;
  select round into rd from quiz_state where id = 1;
  insert into quiz_participants (round, device_id, unit) values (rd, p_device, u)
  on conflict (round, device_id) do update set unit = excluded.unit;
  return json_build_object('ok', true, 'round', rd);
end $$;

-- 作答（目前這一題、時間內、已報到，每題限一次；寬限 1.5 秒網路延遲）
create or replace function public.quiz_answer(p_device text, p_q int, p_ans text)
returns json language plpgsql security definer set search_path = public as $$
declare s quiz_state;
begin
  select * into s from quiz_state where id = 1;
  if s.status not in ('active','revealed') or s.current_q <> p_q or now() > s.deadline_at + interval '1.5 seconds' then
    return json_build_object('ok', false, 'err', 'closed');
  end if;
  if p_ans not in ('T','F') then return json_build_object('ok', false, 'err', 'bad_answer'); end if;
  if not exists (select 1 from quiz_participants where round = s.round and device_id = p_device) then
    return json_build_object('ok', false, 'err', 'not_joined');
  end if;
  insert into quiz_answers (round, device_id, q, answer) values (s.round, p_device, p_q, p_ans) on conflict do nothing;
  return json_build_object('ok', true, 'ans', (select answer from quiz_answers where round = s.round and device_id = p_device and q = p_q));
end $$;

-- 教官控場（需密碼）：check／get_config／save_config／set_pin／start／reveal／finish／reset／history
create or replace function public.quiz_host(p_pin text, p_action text, p_q int default null, p_data jsonb default null)
returns json language plpgsql security definer set search_path = public as $$
declare s quiz_state; n int; i int; qs jsonb; sec int; newpin text; rd int; qsec jsonb;
begin
  select * into s from quiz_state where id = 1;
  if encode(sha256(convert_to(coalesce(p_pin, ''), 'UTF8')), 'hex') <> s.host_hash then
    perform pg_sleep(1);   -- 密碼錯誤延遲 1 秒，防止被程式猜密碼
    return json_build_object('ok', false, 'err', 'bad_pin');
  end if;
  n := jsonb_array_length(s.config->'questions');

  if p_action = 'check' then
    null;
  elsif p_action = 'get_config' then
    return json_build_object('ok', true, 'config', s.config);
  elsif p_action = 'save_config' then
    if s.status = 'active' then return json_build_object('ok', false, 'err', 'busy'); end if;
    qs := p_data->'questions';
    if jsonb_typeof(qs) <> 'array' or jsonb_array_length(qs) < 1 or jsonb_array_length(qs) > 50 then
      return json_build_object('ok', false, 'err', 'bad_questions');
    end if;
    for i in 0 .. jsonb_array_length(qs) - 1 loop
      if length(btrim(coalesce(qs->i->>'text', ''))) = 0 or jsonb_typeof(qs->i->'answer') <> 'boolean' then
        return json_build_object('ok', false, 'err', 'bad_questions', 'at', i + 1);
      end if;
      qsec := qs->i->'seconds';
      if qsec is not null and jsonb_typeof(qsec) <> 'null' and
         (jsonb_typeof(qsec) <> 'number' or (qsec::text)::numeric < 5 or (qsec::text)::numeric > 180) then
        return json_build_object('ok', false, 'err', 'bad_qseconds', 'at', i + 1);
      end if;
    end loop;
    if jsonb_typeof(p_data->'units') <> 'array' then return json_build_object('ok', false, 'err', 'bad_units'); end if;
    sec := coalesce((p_data->>'seconds')::int, 20);
    if sec < 5 or sec > 180 then return json_build_object('ok', false, 'err', 'bad_seconds'); end if;
    update quiz_state set config = jsonb_build_object(
        'units', p_data->'units', 'seconds', sec,
        'passRate', coalesce((p_data->>'passRate')::numeric, 0.6), 'questions', qs)
     where id = 1;
  elsif p_action = 'set_pin' then
    newpin := btrim(coalesce(p_data->>'pin', ''));
    if length(newpin) < 4 then return json_build_object('ok', false, 'err', 'short_pin'); end if;
    update quiz_state set host_hash = encode(sha256(convert_to(newpin, 'UTF8')), 'hex') where id = 1;
  elsif p_action = 'start' then
    if p_q is null or p_q < 1 or p_q > n then return json_build_object('ok', false, 'err', 'bad_q'); end if;
    -- 本題有設定秒數就用本題的，沒有就用預設秒數
    sec := coalesce(nullif(s.config->'questions'->(p_q - 1)->>'seconds', '')::numeric::int, (s.config->>'seconds')::int, 20);
    update quiz_state set status = 'active', current_q = p_q, seconds = sec,
           started_at = now(), deadline_at = now() + make_interval(secs => sec) where id = 1;
    insert into quiz_qlog (round, q, started_at, seconds, eligible, qtext, answer)
    values (s.round, p_q, now(), sec, (select count(*) from quiz_participants where round = s.round),
            s.config->'questions'->(p_q - 1)->>'text', (s.config->'questions'->(p_q - 1)->>'answer')::boolean)
    on conflict (round, q) do update set started_at = excluded.started_at, seconds = excluded.seconds,
      eligible = excluded.eligible, qtext = excluded.qtext, answer = excluded.answer;
  elsif p_action = 'reveal' then
    update quiz_state set status = 'revealed', deadline_at = least(deadline_at, now()) where id = 1 and status = 'active';
  elsif p_action = 'finish' then
    update quiz_state set status = 'finished' where id = 1;
  elsif p_action = 'reset' then
    update quiz_state set round = round + 1, status = 'waiting', current_q = 0, started_at = null, deadline_at = null where id = 1;
  elsif p_action = 'history' then
    -- 歷次梯次成績：p_q 指定梯次（未指定＝目前梯次）
    rd := coalesce(p_q, s.round);
    return json_build_object('ok', true, 'current', s.round,
      'rounds', coalesce((select json_agg(json_build_object('round', r, 'n', np, 'first', floor(extract(epoch from t0) * 1000)) order by r desc)
                  from (select x.r, (select count(*) from quiz_participants p where p.round = x.r) np,
                               least((select min(joined_at) from quiz_participants p where p.round = x.r),
                                     (select min(started_at) from quiz_qlog l where l.round = x.r)) t0
                          from (select distinct round r from quiz_participants
                                union select distinct round from quiz_qlog
                                union select s.round) x) z), '[]'::json),
      'detail', json_build_object(
        'round', rd,
        'total', (select count(*) from quiz_participants where round = rd),
        'units', coalesce((select json_agg(json_build_object('u', unit, 'n', c) order by c desc, unit)
                             from (select unit, count(*) c from quiz_participants where round = rd group by unit) u), '[]'::json),
        'questions', coalesce((select json_agg(json_build_object(
                      'q', k.q,
                      'text', coalesce(l.qtext, s.config->'questions'->(k.q - 1)->>'text'),
                      'answer', coalesce(l.answer, (s.config->'questions'->(k.q - 1)->>'answer')::boolean),
                      'eligible', coalesce(l.eligible, (select count(*) from quiz_participants where round = rd)),
                      't', (select count(*) from quiz_answers a where a.round = rd and a.q = k.q and a.answer = 'T'),
                      'f', (select count(*) from quiz_answers a where a.round = rd and a.q = k.q and a.answer = 'F')) order by k.q)
                    from (select q from quiz_qlog where round = rd union select distinct q from quiz_answers where round = rd) k
                    left join quiz_qlog l on l.round = rd and l.q = k.q), '[]'::json)));
  else
    return json_build_object('ok', false, 'err', 'bad_action');
  end if;
  return json_build_object('ok', true);
end $$;

</script>

  document.addEventListener("visibilitychange", () => { if (!document.hidden) loop(); });
  render(true); loop();
}

/* ===================================================================
   教官端（網址加 ?host）
   =================================================================== */
function hostInit(){
  document.body.classList.add("host");
  document.getElementById("ttl").textContent = "隨堂測驗・教官控場看板";
  let S = null, CFG = null, pin = SS.get("dq_pin") || "", busy = false, ok = true, lastKey = "";
  let tab = "ctrl", draft = null, dirty = false, wizStep = hasCfg() ? 4 : 1;

  /* ---------- 控場音效與節奏音樂（Web Audio 即時合成，不需音檔、不需網路） ---------- */
  const SFX = (() => {
    let ctx = null, master = null, noiseBuf = null;
    let on = LS.get("dq_sfx") !== "0", music = LS.get("dq_music") !== "0", muted = LS.get("dq_mute") === "1";
    let vol = Number(LS.get("dq_vol") || 2); if (!(vol >= 1 && vol <= 3)) vol = 2;
    const VOLS = [0, 0.35, 0.7, 1.0];
    function ac(){
      if (!ctx) {
        const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
        ctx = new C(); master = ctx.createGain(); master.connect(ctx.destination);
        noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      if (ctx.state === "suspended") ctx.resume();
      master.gain.value = muted ? 0 : (VOLS[vol] || 0.7);
      return ctx;
    }
    // 單音：dest 未指定時接到總音量
    function tone(freq, at, dur, type, peak, glide, dest, absT){
      const c = ctx; if (!c || c.state !== "running" || muted) return;
      const t = absT != null ? absT : c.currentTime + (at || 0), o = c.createOscillator(), g = c.createGain();
      o.type = type || "sine"; o.frequency.setValueAtTime(freq, t);
      if (glide) o.frequency.exponentialRampToValueAtTime(glide, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak || 0.25, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + dur + 0.05);
    }
    function sfx(freq, at, dur, type, peak, glide){ if (on) { ac(); tone(freq, at, dur, type, peak, glide); } }
    function noise(t, dur, peak, hp, dest){
      if (!ctx || muted) return;
      const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      s.buffer = noiseBuf; f.type = "highpass"; f.frequency.value = hp || 6000;
      g.gain.setValueAtTime(peak, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(dest); s.start(t); s.stop(t + dur + 0.02);
    }

    /* ---- 節奏音樂：lobby＝報到待機；game＝作答中；urgent＝最後 5 秒 ---- */
    const N = n => 440 * Math.pow(2, (n - 69) / 12);   // MIDI 音高 → 頻率
    const SONGS = {
      // 報到待機：輕快 lounge（Am–F–C–G），每分鐘 100 拍
      lobby: { bpm: 100, gain: 0.32, chords: [[57,60,64],[53,57,60],[48,52,55],[55,59,62]], bass: [45,41,36,43] },
      // 作答中：四拍鼓組＋貝斯（Em–C–G–D），每分鐘 124 拍
      game: { bpm: 124, gain: 0.42, chords: [[52,55,59],[48,52,55],[55,59,62],[50,54,57]], bass: [40,36,43,38] },
      // 最後 5 秒：加速、升調、16 分音符銅鈸＋小鼓連擊
      urgent: { bpm: 152, gain: 0.5, chords: [[54,57,61],[50,54,57],[57,61,64],[52,56,59]], bass: [42,38,45,40] }
    };
    let mode = null, bus = null, nextT = 0, step = 0, timer = null;
    function playStep(m, i, t){
      const S = SONGS[m], bar = Math.floor(i / 16) % 4, s = i % 16, ch = S.chords[bar], b = S.bass[bar], len = 60 / S.bpm / 4;
      if (m === "lobby") {
        if (s === 0 || s === 8) tone(70, 0, 0.18, "sine", 0.5, 40, bus, t);                    // 輕柔大鼓
        if (s % 4 === 2) noise(t, 0.04, 0.12, 8000, bus);                                      // 反拍腳踏鈸
        if (s === 0 || s === 6 || s === 10) tone(N(b), 0, len * 3, "triangle", 0.35, null, bus, t); // 貝斯
        if (s % 2 === 0) tone(N(ch[(s / 2) % 3] + 12), 0, len * 1.6, "sine", 0.13, null, bus, t);   // 琶音
        if (s === 0) ch.forEach(n => tone(N(n), 0, len * 14, "triangle", 0.05, null, bus, t));      // 和弦鋪底
      } else {
        const urgent = m === "urgent";
        if (s % 4 === 0) tone(urgent ? 75 : 62, 0, 0.22, "sine", 0.85, 38, bus, t);           // 四拍大鼓
        if (s === 4 || s === 12 || (urgent && s >= 13)) { noise(t, 0.12, 0.45, 1800, bus); tone(190, 0, 0.08, "triangle", 0.25, 120, bus, t); } // 小鼓
        if (urgent || s % 2 === 0) noise(t, s % 4 === 2 ? 0.09 : 0.035, s % 4 === 2 ? 0.16 : 0.09, 7000, bus); // 銅鈸
        if (s % 2 === 0) tone(N(b + (s % 8 === 6 ? 12 : 0)), 0, len * 1.7, "sawtooth", 0.17, null, bus, t);   // 貝斯八分音符
        if (s === 0 || s === 10) ch.forEach(n => tone(N(n + 12), 0, len * 1.4, "square", 0.035, null, bus, t)); // 和弦刺擊
        if (urgent && s % 4 === 0) tone(N(ch[2] + 24), 0, len, "square", 0.05, null, bus, t);  // 高音警示
      }
    }
    function schedule(){
      if (!mode || !ctx) return;
      const len = 60 / SONGS[mode].bpm / 4;
      while (nextT < ctx.currentTime + 0.15) { playStep(mode, step, nextT); nextT += len; step++; }
    }
    function setMode(m){
      if (m === mode) return;
      const c = ctx;
      if (bus && c) { const old = bus; old.gain.setTargetAtTime(0, c.currentTime, 0.04); setTimeout(() => old.disconnect(), 400); bus = null; }
      mode = m;
      if (!m || !c || c.state !== "running") { mode = null; return; }
      bus = c.createGain(); bus.gain.value = SONGS[m].gain; bus.connect(master);
      if (m !== "urgent") step = 0;                      // 進入最後 5 秒時接續原本拍點
      nextT = c.currentTime + 0.05;
      if (!timer) timer = setInterval(schedule, 25);
    }

    const api = {
      unlock(){ ac(); },
      ready(){ return !!ctx && ctx.state === "running"; },
      get on(){ return on; }, get music(){ return music; }, get muted(){ return muted; }, get vol(){ return vol; }, get mode(){ return mode; },
      toggle(){ on = !on; LS.set("dq_sfx", on ? "1" : "0"); if (on) { ac(); setTimeout(api.join, 60); } return on; },
      toggleMusic(){ music = !music; LS.set("dq_music", music ? "1" : "0"); ac(); if (!music) setMode(null); return music; },
      toggleMute(){ muted = !muted; LS.set("dq_mute", muted ? "1" : "0"); ac(); if (muted) setMode(null); else setTimeout(api.join, 60); return muted; },
      cycleVol(){ vol = vol >= 3 ? 1 : vol + 1; LS.set("dq_vol", String(vol)); ac(); if (on) api.join(); return vol; },
      setMode(m){ setMode(music && !muted && api.ready() ? m : null); },
      // 有人報到：清脆「叮咚」
      join(){ sfx(880, 0, 0.12, "sine", 0.22); sfx(1320, 0.08, 0.18, "sine", 0.2); },
      // 開始作答：上行四音號角
      start(){ [523, 659, 784, 1047].forEach((f, i) => sfx(f, i * 0.1, i === 3 ? 0.5 : 0.22, "triangle", 0.32)); sfx(131, 0, 0.6, "sine", 0.3); },
      // 倒數節奏（音樂關閉時才用）：每秒「滴答」交替
      beat(n){ const hi = n % 2 === 0; sfx(hi ? 1000 : 760, 0, 0.05, "square", 0.07); sfx(hi ? 110 : 82, 0, 0.16, "sine", 0.32, 50); },
      // 最後 5 秒：急促高音嗶（每半秒一次）
      hurry(final){ sfx(final ? 1568 : 1319, 0, 0.09, "square", 0.13); sfx(98, 0, 0.12, "sine", 0.3, 55); },
      // 時間到：低沉蜂鳴
      buzzer(){ sfx(196, 0, 0.7, "sawtooth", 0.2, 98); sfx(147, 0, 0.7, "sawtooth", 0.16, 73); },
      // 揭曉：明亮和弦
      reveal(at){ [784, 988, 1175, 1568].forEach((f, i) => sfx(f, (at || 0) + i * 0.09, 0.7, "sine", 0.2)); },
      // 測驗結束：勝利號角
      finish(){ [[523,0],[523,.15],[523,.3],[659,.45],[784,.75],[659,.95],[784,1.1]].forEach(([f, t], i) => sfx(f, t, i === 6 ? 0.9 : 0.2, "triangle", 0.3)); sfx(131, 1.1, 0.9, "sine", 0.3); }
    };
    return api;
  })();
  let sfxPrev = null, sfxBeat = null, sfxJoinAt = 0;
  // 依狀態變化觸發音效（第一次讀到狀態時不發聲）
  function sfxOnState(){
    if (!S) return;
    const cur = { status: S.status, q: S.q, round: S.round, total: S.total };
    const p = sfxPrev; sfxPrev = cur;
    if (!p) return;
    if (cur.round !== p.round) return;
    if (cur.status === "active" && (p.status !== "active" || p.q !== cur.q)) { SFX.setMode(null); SFX.start(); sfxBeat = null; }
    else if (cur.status === "revealed" && p.status === "active") { SFX.setMode(null); SFX.buzzer(); SFX.reveal(0.75); }
    else if (cur.status === "finished" && p.status !== "finished") SFX.finish();

  }
  // 每 0.1 秒：切換背景音樂段落；音樂關閉時改用滴答節拍
  function sfxTick(){

    else if (S.status === "revealed") main = S.q < NQ ? `<button type="button" class="cbtn" data-a="start" data-q="${S.q + 1}" ${d}>⏭ 下一題（第 ${S.q + 1} 題）</button>` : `<button type="button" class="cbtn go" data-a="finish" ${d}>🏁 結束測驗</button>`;

  function barsHTML(item){
    const c = S.counts || { t:0, f:0 }, total = Math.max(S.eligible == null ? S.total : S.eligible, c.t + c.f), none = Math.max(0, total - c.t - c.f);

  /* ---------- 成績計算（結束畫面與歷次梯次共用） ---------- */
  let hist = null, histBusy = false, histRound = null;
  function histKey(){ return hist && hist.detail ? hist.detail.round + ":" + JSON.stringify(hist.detail.questions.map(x => [x.t, x.f])) : ""; }
  // 結束畫面要用目前梯次的資料：資料庫是新版時向伺服器取，舊版就用輪詢結果＋目前題庫
  function curDetail(){
    const want = JSON.stringify(S.summary || []);
    if (!needUpdate()) {
      if (hist && hist.detail && hist.detail.round === S.round && hist._sum === want) return hist.detail;
      if (!histBusy) { histBusy = true; hostCall("history", S.round).then(r => { if (r.ok) { hist = r; hist._sum = want; } }).catch(() => {}).then(() => { histBusy = false; lastKey = ""; render(true); }); }

  }
  function scoreOf(D){
    const rows = D.questions.map(x => { const n = Math.max(x.eligible || 0, x.t + x.f), right = x.answer ? x.t : x.f; return Object.assign({}, x, { n, right, none: Math.max(0, n - x.t - x.f), rate: n ? right / n : null }); });
    const sumN = rows.reduce((a, x) => a + x.n, 0), sumR = rows.reduce((a, x) => a + x.right, 0);

    if (sa === "unlock") { setTimeout(() => { SFX.join(); rer(); }, 80); return; }
    if (sa === "mute") { SFX.toggleMute(); rer(); return; }
    if (sa === "sfx") { SFX.toggle(); rer(); return; }
    if (sa === "music") { SFX.toggleMusic(); rer(); return; }
    if (sa === "vol") { SFX.cycleVol(); rer(); return; }
    if (sa === "fs") { toggleFs(); return; }
    if (sa === "copyupd") { copyText(document.getElementById("sqlUpdate").textContent.trim() + "\n", "已複製更新用 SQL，請到 Supabase 的 SQL Editor 貼上按 Run"); return; }
    if (sa === "histcsv") { exportCsv(false); return; }
    if (sa === "histcsvall") { exportCsv(true); return; }
    // 精靈
    if (b.id === "wCopy") { copyText(sqlText(), "已複製 SQL，請到 Supabase 的 SQL Editor 貼上執行"); if (wizStep < 3) { wizStep = 3; } return; }
    if (b.id === "wTest") { wizardTest(); return; }
    if (b.id === "wDown") { downloadConfigured(); return; }
    if (b.id === "wLogin") { loginView(); return; }
    if (b.id === "toWiz") { wizStep = 1; wizardView(); return; }
    if (b.id === "pinGo") { tryLogin(); return; }
    if (b.dataset.tab) { setTab(b.dataset.tab); return; }
    const a = b.dataset.a;
    if (a === "download") { downloadConfigured(); return; }
    if (a === "logout") { pin = ""; SS.del("dq_pin"); loginView(); return; }
    if (a === "reset" && !b.classList.contains("armed")) {
      b.classList.add("armed"); b.textContent = "再按一次確認重置（目前梯次結束，開新梯次）";
      setTimeout(() => { if (b.isConnected) { b.classList.remove("armed"); b.textContent = "🔄 重置整場（開新梯次）"; } }, 4000);
      return;
    }
    if (a) { act(a, b.dataset.q ? Number(b.dataset.q) : null); return; }
    // 題目編輯
    if (b.dataset.mv !== undefined) { const i = +b.dataset.mv, j = i + +b.dataset.dir, Q = draft.questions; [Q[i], Q[j]] = [Q[j], Q[i]]; markDirty(); editView(); return; }
    if (b.dataset.del !== undefined) {
      if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "再按一次確認刪除"; setTimeout(() => { if (b.isConnected) { b.classList.remove("armed"); b.textContent = "🗑 刪除"; } }, 3000); return; }
      draft.questions.splice(+b.dataset.del, 1); markDirty(); editView(); return;
    }
    if (b.dataset.ansset !== undefined) { draft.questions[+b.dataset.ansset].answer = b.dataset.v === "1"; markDirty(); editView(); return; }
    if (b.id === "qAdd") {
      draft.questions.push({ text:"", answer:true, comment:"" }); markDirty(); editView();
      const t = document.querySelectorAll('textarea[data-f="text"]'); const last = t[t.length - 1]; if (last) { last.focus(); last.scrollIntoView({ block:"center" }); }
      return;
    }
    if (b.id === "qUndo") { draft = JSON.parse(JSON.stringify(CFG)); dirty = false; editView(); return; }
    if (b.id === "qSave") {
      const out = JSON.parse(JSON.stringify(draft));
      const badSec = out.questions.findIndex(q => q.seconds != null && q.seconds !== "" && !(Number(q.seconds) >= 5 && Number(q.seconds) <= 180));
      if (badSec >= 0) { const m = document.getElementById("qMsg"); m.className = "msg err"; m.textContent = `❌ 第 ${badSec + 1} 題的秒數請填 5～180，或留空使用預設秒數。`; return; }
      out.questions = out.questions.map(q => { const o = { text: q.text.trim(), answer: !!q.answer, comment: (q.comment || "").trim() }; if (q.seconds != null && q.seconds !== "") o.seconds = Math.round(Number(q.seconds)); return o; });
      if (await saveAll(out, "qMsg")) { draft = JSON.parse(JSON.stringify(CFG)); dirty = false; editView(); const m = document.getElementById("qMsg"); m.className = "msg ok"; m.textContent = "✅ 已儲存，學員端立即生效"; }
      return;
    }
    // 設定
    if (b.id === "sSave") {
      const units = document.getElementById("sUnits").value.split("\n").map(x => x.trim()).filter(Boolean).slice(0, 30);
      const sec = Number(document.getElementById("sSec").value), pass = Number(document.getElementById("sPass").value);
      const m = document.getElementById("sMsg");
      if (!(sec >= 5 && sec <= 180)) { m.className = "msg err"; m.textContent = "❌ 作答秒數請在 5～180 之間"; return; }
      if (!(pass >= 0 && pass <= 100)) { m.className = "msg err"; m.textContent = "❌ 門檻請在 0～100 之間"; return; }
      await loadCfg().catch(() => {});
      saveAll(Object.assign({}, CFG, { units, seconds: sec, passRate: pass / 100 }), "sMsg");
      return;
    }
    if (b.id === "pSave") {
      const p1 = document.getElementById("pNew").value.trim(), p2 = document.getElementById("pNew2").value.trim(), m = document.getElementById("pMsg");
      if (p1.length < 4) { m.className = "msg err"; m.textContent = "❌ 密碼至少 4 碼（建議 6 碼以上）"; return; }
      if (p1 !== p2) { m.className = "msg err"; m.textContent = "❌ 兩次輸入不一樣"; return; }
      try { const r = await hostCall("set_pin", null, { pin: p1 }); if (r.ok) { pin = p1; SS.set("dq_pin", p1); m.className = "msg ok"; m.textContent = "✅ 密碼已更改，下次登入請用新密碼"; document.getElementById("pNew").value = document.getElementById("pNew2").value = ""; } }
      catch(err) { if (err.message !== "bad_pin") { m.className = "msg err"; m.textContent = "❌ " + connErr(err); } }
      return;
    }
    if (b.id === "sCopySql") { copyText(sqlText(), "已複製 SQL"); return; }
    if (b.id === "sForget") { LS.del("dq_url"); LS.del("dq_key"); pin = ""; SS.del("dq_pin"); wizStep = 1; wizardView(); return; }
  });
  app.addEventListener("input", e => {
    const t = e.target;
    if (t.dataset && t.dataset.f && draft) { draft.questions[+t.dataset.i][t.dataset.f] = t.dataset.f === "seconds" ? (t.value.trim() === "" ? null : Number(t.value)) : t.value; markDirty(); }
  });
  app.addEventListener("keydown", e => { if (e.target.id === "pin" && e.key === "Enter") tryLogin(); });
  function toggleFs(){
    try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch(e) { toast("此瀏覽器不支援全螢幕，請按 F11"); }
  }
  document.addEventListener("fullscreenchange", () => { const b = document.querySelector(".htab.fs"); if (b) b.textContent = document.fullscreenElement ? "⛶ 離開全螢幕" : "⛶ 全螢幕"; });
  // 簡報筆的「下一頁／上一頁」就是鍵盤的 → PgDn／← PgUp
  window.addEventListener("keydown", e => {
    const tg = e.target, typing = tg && (tg.tagName === "INPUT" || tg.tagName === "TEXTAREA" || tg.tagName === "SELECT" || tg.isContentEditable);
    if (!pin || tab !== "ctrl" || typing || e.ctrlKey || e.metaKey || e.altKey || !S) return;
    SFX.unlock();
    const k = e.key, next = ["ArrowRight", "PageDown", " ", "Enter"].includes(k), stop = ["ArrowLeft", "PageUp", "Escape"].includes(k);
    if (k === "m" || k === "M") { e.preventDefault(); SFX.toggleMute(); lastKey = ""; render(true); toast(SFX.muted ? "🔇 已全部靜音" : "🔊 已恢復聲音"); return; }
    if (k === "f" || k === "F") { e.preventDefault(); toggleFs(); return; }
    if (!next && !stop) return;
    e.preventDefault();
    if (busy) return;
    const NQ = (CFG && CFG.questions || []).length;
    if (next) {
      if (S.status === "waiting" && NQ) act("start", 1);
      else if (S.status === "revealed") { if (S.q < NQ) act("start", S.q + 1); else act("finish"); }
      else if (S.status === "active") toast("作答中：要提早截止請按 ← 或 Esc");
    } else if (stop && S.status === "active") act("reveal");
  });
  window.addEventListener("beforeunload", e => { if (tab === "edit" && dirty) { e.preventDefault(); e.returnValue = ""; } });

  let running = false;
  async function loop(){
    if (running) return; running = true;
    while (pin) {
      if (!busy) {
        try { S = await poll(""); S._t = Date.now(); ok = true; if (!CFG) await loadCfg(); } catch(e) { ok = false; }
        sfxOnState(); render();
      }
      await new Promise(z => setTimeout(z, 1000));
    }
    running = false;
  }
  setInterval(tick, 200);
  setInterval(sfxTick, 100);
  if (!hasCfg()) wizardView();
  else if (pin) { shell(); loop(); }
  else loginView();
}

if (IS_HOST) hostInit(); else studentInit();
</script>
</body>
</html>
